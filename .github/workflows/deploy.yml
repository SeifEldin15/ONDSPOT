name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@52.53.124.180 << 'EOF'
            set -e

            APP_DIR="/home/ubuntu/myapp"
            REPO_SSH="git@github.com:SeifEldin15/ONDSPOT.git"

            # Clone repo if not exists
            if [ ! -d "\$APP_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone "\$REPO_SSH" "\$APP_DIR"
            fi

            cd "\$APP_DIR"

            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm install --production

            echo "Restarting app with PM2..."
            pm2 restart server.js --name my-node-app || pm2 start server.js --name my-node-app
          EOF
