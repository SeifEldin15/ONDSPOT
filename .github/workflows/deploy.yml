name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@52.53.124.180 << EOF
            APP_DIR="/home/ubuntu/myapp"
            REPO_SSH="git@github.com:SeifEldin15/ONDSPOT.git"

            if [ ! -d "\$APP_DIR" ]; then
              git clone "\$REPO_SSH" "\$APP_DIR"
            fi

            cd "\$APP_DIR"
            git pull origin main
            npm install --production
            pm2 restart server.js --name my-node-app || pm2 start server.js --name my-node-app
          EOF

      - name: Mark deployment in GitHub
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              required_contexts: [],
              environment: "production",
              auto_merge: false
            });
