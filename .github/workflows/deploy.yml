name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main  # or your deploy branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@52.53.124.180 << 'EOF'
            APP_DIR="/home/ubuntu/myapp"
            
            # Clone repo if directory does not exist
            if [ ! -d "$APP_DIR" ]; then
              git clone git@github.com:YOUR_USERNAME/YOUR_REPO.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull origin main
            npm install --production
            pm2 restart server.js --name my-node-app || pm2 start server.js --name my-node-app
          EOF
